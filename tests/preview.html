<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="icon" href="../favicon.svg"><title>Ảnh kiểm tra giao diện</title><style>html,body{margin:0;padding:0;overflow:hidden}iframe{border:0;display:block}</style></head><body><script>
const query=new URLSearchParams(location.search);
const frame=document.createElement('iframe');
frame.style.width=(Number(query.get('width'))||1366)+'px';
frame.style.height=(Number(query.get('height'))||768)+'px';
const file=['index','reception','housekeeping'].includes(query.get('file'))?query.get('file'):'index';
frame.src='../'+file+'.html#'+encodeURIComponent(query.get('screen')||'overview');
document.body.append(frame);
</script></body></html>
